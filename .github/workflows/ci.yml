name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valeur factice : uniquement pour que Prisma puisse générer le client.
      # Aucune connexion à une base de données n'est faite pendant la CI.
      DATABASE_URL: postgresql://user:password@localhost:5432/pharmacy?schema=public
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm prisma:generate

      - name: Compiler le package database
        run: pnpm --filter @pharmacy/database build

      - name: Type-check API
        run: pnpm --filter api type-check

      - name: Build API
        run: pnpm --filter @pharmacy/api build

      - name: Build web
        run: pnpm --filter web build
